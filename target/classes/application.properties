spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpatialDemo;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=VeryStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.root=ERROR
logging.level.org.springframework=ERROR
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

simulation.user-count=500
simulation.node-count=30
simulation.map-size=100.0
simulation.spatial-threshold=15.0
simulation.time-threshold=10.0
simulation.rtree-buffer=5.0
simulation.max-departure-time=30.0
simulation.min-deadline-offset=20.0
simulation.max-deadline-offset=30.0
simulation.random-seed=42