spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SpatialDemo;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=VeryStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.root=ERROR
logging.level.org.springframework=ERROR
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

simulation.user-count=1000
simulation.node-count=60
simulation.map-size=100.0
simulation.spatial-threshold=30.0
simulation.time-threshold=20.0
simulation.rtree-buffer=5.0

simulation.max-departure-time=240.0
simulation.min-deadline-offset=30.0
simulation.max-deadline-offset=60.0

simulation.driver-ratio=0.4
simulation.min-vehicle-capacity=2
simulation.max-vehicle-capacity=4

simulation.simulation-horizon=36000.0
simulation.cycle-duration=15.0
simulation.max-user-stops=3
simulation.random-seed=42